name: macOS app

on:
  push:
    paths: ['macos/**', 'icons/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'icons/**', '.github/workflows/macos.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Test the sky engine
        run: swift test
      - name: Build Huecast.app
        run: ./build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Huecast.app build/Huecast.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Huecast-macOS
          path: macos/build/Huecast.zip
      # Opens the app on a fixed place, then the menu bar widget (compact
      # and expanded); the app waits at each step for the screenshot
      - name: Screenshots
        continue-on-error: true
        run: |
          SHOTS="$PWD/build/shots"
          mkdir -p "$SHOTS"
          open -n build/Huecast.app --args -lat 18.217 -lon -63.057 -name "The Valley, AI" -snapshots "$SHOTS"
          for step in compact expanded window; do
            for i in $(seq 1 90); do [ -f "$SHOTS/$step.ready" ] && break; sleep 1; done
            screencapture -x "$SHOTS/screen-$step.png" || echo "screencapture failed"
            touch "$SHOTS/$step.done"
          done
          sleep 3
          rm -f "$SHOTS"/*.ready "$SHOTS"/*.done
          ls -la "$SHOTS"
      - uses: actions/upload-artifact@v4
        with:
          name: Huecast-screenshots
          path: macos/build/shots
