name: macOS app

on:
  push:
    paths: ['macos/**', 'icons/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'icons/**', '.github/workflows/macos.yml']
  workflow_dispatch:

# publishing a release needs to write to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Test the sky engine
        run: swift test
      - name: Build Huecast.app
        env:
          VERSION: 1.0.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          # analytics keys (Settings → Secrets and variables → Actions);
          # without them the app is built with analytics off
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: ./build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Huecast.app build/Huecast.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Huecast-macOS
          path: macos/build/Huecast.zip
      # Every build of the default branch becomes the latest release, so
      # .../releases/latest/download/Huecast.zip (linked from the website)
      # always serves the newest app
      - name: Publish release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mac-1.0.${{ github.run_number }}" build/Huecast.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Huecast for Mac 1.0.${{ github.run_number }}" \
            --notes "Huecast for macOS 14 or later. Unzip, move Huecast.app to Applications and open it. It isn't notarized yet: the first time, run \`xattr -dr com.apple.quarantine /Applications/Huecast.app\` or allow it in System Settings → Privacy & Security." \
            --latest
      # Opens the app on a demo scene, then the menu bar widget and full
      # screen; the app waits at each step for the screenshot. One run per
      # scene, each in its own folder
      - name: Screenshots
        continue-on-error: true
        run: |
          shoot() {
            SHOTS="$PWD/build/shots/$1"; shift
            mkdir -p "$SHOTS"
            open -n build/Huecast.app --args -demo "$@" -snapshots "$SHOTS"
            for step in widget window fullscreen; do
              for i in $(seq 1 90); do [ -f "$SHOTS/$step.ready" ] && break; sleep 1; done
              screencapture -x "$SHOTS/screen-$step.png" || echo "screencapture failed"
              touch "$SHOTS/$step.done"
            done
            for i in $(seq 1 30); do pgrep -x Huecast >/dev/null || break; sleep 1; done
            pkill -x Huecast || true
            rm -f "$SHOTS"/*.ready "$SHOTS"/*.done
          }
          shoot 1-snow-night   -code 75 -temp -2 -hour 1.5  -name "Helsinki, FI"
          shoot 2-hot-noon     -code 0  -temp 34 -hour 13   -name "Seville, ES"
          shoot 3-storm-dusk   -code 95 -temp 24 -hour 19.5 -name "Miami, US"
          shoot 4-fog-morning  -code 45 -temp 9  -hour 8.5  -name "San Francisco, US"
          shoot 5-rain-evening -code 63 -temp 12 -hour 21   -name "London, GB"
          shoot 6-frozen-night -code 0  -temp -14 -hour 23  -name "Oslo, NO"
          ls -R build/shots
      - uses: actions/upload-artifact@v4
        with:
          name: Huecast-screenshots
          path: macos/build/shots
